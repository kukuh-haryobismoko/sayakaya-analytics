# Netlify configuration for Sayakaya Analytics

[build]
  # The static frontend lives in /public and needs no build step.
  publish = "public"
  functions = "netlify/functions"
  # Install all deps (incl. the function's) at build time.
  command = "npm install"

[functions]
  # esbuild is fast; mark the heavier native-ish deps as external so they're
  # bundled from node_modules rather than tree-shaken (avoids dynamic-require
  # breakage in @google-cloud/bigquery and exceljs). pdfkit needs the same
  # treatment for a different reason: it loads its standard-font .afm metric
  # files from disk at runtime (fs.readFileSync), and esbuild's bundling
  # doesn't carry non-JS data files — without this, PDF export fails on
  # Netlify with "ENOENT ... Helvetica.afm" even though it works locally.
  node_bundler = "esbuild"
  external_node_modules = ["@google-cloud/bigquery", "exceljs", "pdfkit"]

# Scheduled sending (server/schedules.js) — this function just pings
# POST /api/cron/run-due-schedules on a timer; see
# netlify/functions/cron-run-schedules.js. Requires CRON_SECRET to be set as
# an environment variable (Site settings > Environment variables) — the same
# value the function sends and the API route checks.
[functions."cron-run-schedules"]
  schedule = "*/15 * * * *"

# Send every API call to the Express function. status 200 = rewrite (URL stays /api/...).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback: anything that isn't a real file or an API call serves the app.
# (Netlify serves existing files first, so this only catches unknown paths.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
