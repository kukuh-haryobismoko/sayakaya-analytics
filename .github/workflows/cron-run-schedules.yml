name: Run due e-statement schedules

# Backup tick for the scheduled-sending backend (server/schedules.js / supabase/functions/api/schedules.ts).
# The main tick is pg_cron inside Supabase, every 10 seconds (SUPABASE-DEPLOY.md, "Scheduled
# sending tick"); GitHub fires this one only every few hours in practice.
# Requires the CRON_SECRET repo secret to match the CRON_SECRET Supabase secret
# (`supabase secrets set CRON_SECRET=...`).

on:
  schedule:
    # ponytail: offset off the :00/:15/:30/:45 marks — GitHub's own docs say schedule
    # events queue longest exactly on those marks since every repo fires there too.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

jobs:
  run-due-schedules:
    # ponytail: this repo is pushed to two GitHub remotes (personal + office); guard
    # so the schedule only ever fires from the canonical one, never both.
    if: github.repository == 'kukuh-haryobismoko/sayakaya-analytics'
    runs-on: ubuntu-latest
    steps:
      - name: Ping run-due-schedules
        run: |
          status=$(curl -s -o /tmp/body -w '%{http_code}' -X POST \
            -H "x-cron-key: ${{ secrets.CRON_SECRET }}" \
            https://josptpfisrsdjeggkqke.supabase.co/functions/v1/api/cron/run-due-schedules)
          cat /tmp/body
          echo
          if [ "$status" -ge 300 ]; then
            echo "run-due-schedules failed with status $status"
            exit 1
          fi
